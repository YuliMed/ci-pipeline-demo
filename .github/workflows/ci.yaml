name: CI Pipeline  

on:
  push:  # Triggers on EVERY push to ANY branch 
    branches: [ '**' ]  

jobs:
  ci:  
    runs-on: ubuntu-latest  

    steps:
      - name: Checkout code
        uses: actions/checkout@v4  

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'  # Matches Dockerfile

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest  # For tests

      - name: Run tests
        run: |
          export PYTHONPATH=$PYTHONPATH:.
          pytest 



      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .  # Build from root
          push: true  # Actually push to registry
          tags: ${{ secrets.DOCKER_USERNAME }}/ci-pipeline-demo:${{ github.sha }}  # SHA tag—key
